name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows native desktop, Core and CLI
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore native desktop
        run: dotnet restore src/Akara.Desktop/Akara.Desktop.csproj

      - name: Restore test runner
        run: dotnet restore tests/ForjaHoradrica.Tests.csproj

      - name: Restore CLI
        run: dotnet restore src/Akara.Cli/Akara.Cli.csproj

      - name: Build native desktop
        run: dotnet build src/Akara.Desktop/Akara.Desktop.csproj --configuration Release --no-restore

      - name: Compile data-dependent Core checks
        run: dotnet build tests/ForjaHoradrica.Tests.csproj --configuration Release --no-restore

      - name: Build CLI
        run: dotnet build src/Akara.Cli/Akara.Cli.csproj --configuration Release --no-restore

      - name: Verify CLI contracts
        shell: pwsh
        run: |
          dotnet src/Akara.Cli/bin/Release/net10.0/akara-cli.dll version
          if ($LASTEXITCODE -ne 0) { throw 'CLI version failed' }
          dotnet src/Akara.Cli/bin/Release/net10.0/akara-cli.dll schema preview
          if ($LASTEXITCODE -ne 0) { throw 'CLI schema failed' }

      - name: Verify actual WPF rendering and native application behavior
        shell: pwsh
        run: ./scripts/Test-Native.ps1 -Executable ./src/Akara.Desktop/bin/Release/net10.0-windows/Akara.exe

      # Data-dependent Core/CLI/native checks use private copies and local game
      # tables. Their absence is reported explicitly, never counted as passing.
      # No npm, browser host, localhost API or WebView is required by this job.
